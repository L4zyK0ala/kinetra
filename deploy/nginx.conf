# HTTP - HTTPS'e yönlendir
server {
    listen 80;
    listen [::]:80;
    server_name kinetra.internal;
    return 301 https://$host$request_uri;
}

# HTTPS - Kinetra
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kinetra.internal;

    # Profil resmi yüklemede (uygulama tarafında 8 MB'a kadar kabul ediliyor) 413 hatası
    # almamak için nginx'in varsayılan 1 MB sınırını artır.
    client_max_body_size 10M;

    # Self-signed sertifika (yalnızca ev ağı/WireGuard içi kullanım için)
    ssl_certificate /etc/ssl/certs/kinetra.crt;
    ssl_certificate_key /etc/ssl/private/kinetra.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
